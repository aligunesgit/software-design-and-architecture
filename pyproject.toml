[project]
name = "software-design-and-architecture"
version = "0.1.0"
description = "Software Design and Architecture course material"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "codespell<=2.4.1",
  "invoke<=2.2",
  "mkdocs-exclude<=1.0.2",
  "mkdocs-git-revision-date-localized-plugin<=1.4.5",
  "mkdocs-glightbox<=0.4",
  "mkdocs-material<=9.7",
  "mkdocs-material-extensions<=1.3.1",
  "mkdocs-same-dir<=0.1.3",
  "pre-commit<=4.1",
  "pymdown-extensions<=10.14.3",
  "ruff<=0.14.5",
]

# Tools used across the module exercises. Grows as each module's exercises are written -
# add the specific package a module needs when that module's content is filled in.
[dependency-groups]
exercises = [
  # M2 Object-oriented design principles
  "mypy<=2.3.1",
  "pytest<=8.4.2",
  # M5 Architectural styles (a small layered/MVC demo service)
  "fastapi<=0.121.2",
  "uvicorn<=0.38",
  # M7 Microservices (inter-service calls)
  "httpx<=0.28",
  # M8 Distributed systems and resilience patterns
  "tenacity<=9.1",
  "redis<=6.4",
  # M10 Quality attributes, evaluation, and refactoring
  "coverage<=7.11.3",
  "radon<=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.codespell]
skip = "*.pdf,*.ipynb,*.drawio"
